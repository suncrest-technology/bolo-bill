<style>
:root{--acc:#F5A623;--on:#1B2027;--g:#8A5600;--g2:#FEF6E9;--g3:#FBDDA7;--ink:#1B2027;--mut:#5D6772;--line:#E2E6EA;--bg:#F4F6F8;--field:#CFD5DB;--soft:#EEF1F4;--red:#C0392B;--red2:#FDEDEB;--amber:#FFF4DC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Devanagari","Noto Sans Gujarati",sans-serif;font-size:17px;padding-bottom:86px}
header{background:var(--acc);color:var(--on);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.hl{display:flex;align-items:center;gap:11px;min-width:0}.logo{width:44px;height:44px;flex:none;display:block}
.foot{text-align:center;padding:18px 12px 8px;font-size:13px;color:var(--mut)}.foot a{display:inline-flex;align-items:center;gap:7px;color:var(--g);font-weight:700;text-decoration:none;padding:8px 12px;border-radius:999px}.foot a:active{background:var(--g2)}.foot svg{width:20px;height:20px}
.brand{font-size:20px;font-weight:800;line-height:1.2}.sub{font-size:13px;opacity:.8;margin-top:2px}
button,select,input,textarea{font:inherit;color:inherit}
button{border:0;border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer;background:var(--soft);color:var(--ink)}
.lang{background:#fff;color:var(--on);padding:9px 12px;white-space:nowrap;font-size:15px}
main{max-width:720px;margin:0 auto;padding:12px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.panel h2{font-size:17px;margin:0 0 10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.stat small{color:var(--mut);font-size:13px;display:block}.stat strong{font-size:22px}
.voice{text-align:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips.center{justify-content:center}
.chip{flex:none;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:10px 15px;font-weight:700;font-size:15px;color:var(--ink)}
.chip.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.mic{width:100px;height:100px;border-radius:50%;background:var(--acc);color:var(--on);font-size:42px;margin:14px auto 6px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px #C77A0040;padding:0}
.mic.live{background:#c0392b;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #c0392b77}70%{box-shadow:0 0 0 20px #c0392b00}100%{box-shadow:0 0 0 0 #c0392b00}}
.status{min-height:22px;font-size:14px;color:var(--mut);margin:4px 0 10px;line-height:1.45}
.vrow{display:flex;gap:8px;align-items:stretch}.vrow textarea{flex:1;min-height:54px;border:1px solid var(--field);border-radius:12px;padding:10px;resize:vertical;font-size:16px;background:#fff}
.vrow button{background:var(--acc);color:var(--on)}
.hint{font-size:13px;color:var(--mut);line-height:1.5;margin-top:10px;text-align:left}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tile{background:#F8F9FA;border:1px solid var(--line);padding:8px 4px;min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;color:var(--ink);line-height:1.2}
.tile .ic{font-size:26px}.tile small{color:var(--mut);font-weight:600;font-size:12px}
.tile:active{background:var(--g2)}
@media(min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
label.l{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:0 0 5px}
select,input{width:100%;min-height:46px;border:1px solid var(--field);border-radius:10px;padding:8px 10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #F8C36A;border-color:var(--g)}
.warn{border-color:#E8A33A!important;background:var(--amber)!important}
.drow{border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:10px;background:#FBFCFC}
.rf{display:grid;gap:8px}
.rowhead{display:flex;gap:8px}.rowhead select{flex:1;font-weight:700}
.x{background:var(--red2);color:var(--red);padding:0 14px;min-height:44px}
.rf2{display:grid;grid-template-columns:1fr 150px;gap:8px}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;gap:4px}.stepper button{padding:0;font-size:22px;min-height:46px}.stepper input{text-align:center;padding:4px}
.rf3{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:6px}.rf3 label{font-size:12px;color:var(--mut);font-weight:700}
.rfamt{display:flex;justify-content:space-between;align-items:center;background:var(--g2);border-radius:10px;padding:8px 12px}.rfamt strong{color:var(--g);font-size:19px}
.primary{background:var(--acc);color:var(--on);width:100%;min-height:54px;font-size:18px;margin-top:12px}
.full{width:100%;margin-top:8px}
.empty{text-align:center;padding:18px 8px;color:var(--mut);font-size:14px}
.pbtn{background:var(--acc);color:var(--on)}.dbtn{background:var(--red2);color:var(--red)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--mut);padding:6px;position:relative}
nav button span{font-size:22px}nav button.on{color:var(--g)}
nav .badge{position:absolute;top:2px;right:calc(50% - 26px);background:#c0392b;color:#fff;border-radius:999px;font-size:11px;min-width:18px;padding:1px 5px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filters .wide{grid-column:1/-1}
.total{display:flex;justify-content:space-between;align-items:center;background:var(--g2);border-radius:12px;padding:12px 14px;margin-top:10px}.total strong{font-size:24px;color:var(--g)}
.gtot{margin-top:8px;font-size:14px}.gtot div{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px dashed var(--line)}
.btn3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.btn3 button{padding:12px 6px;font-size:15px}
.day{margin-top:16px}.dayh{display:flex;justify-content:space-between;font-weight:800;font-size:14px;color:#4A3A12;border-bottom:2px solid var(--g3);padding-bottom:4px}
.ent{display:flex;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.ent .n{font-weight:700}.ent .m{font-size:13px;color:var(--mut);margin-top:3px}.ent .a{font-weight:800;white-space:nowrap}
.pill{font-size:12px;background:var(--soft);border-radius:20px;padding:2px 8px;color:#4A3A12;font-weight:700;white-space:nowrap}
.srow{border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:8px;display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.srow .small{grid-column:1/-1;min-height:38px;font-size:14px;color:var(--mut)}
.irow{grid-template-columns:30px 1fr 84px auto}.irow .ic{font-size:22px;text-align:center}
.addrow{display:flex;gap:8px}.addrow input{flex:1;min-width:0}
.overlay{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));width:100%;max-width:720px;max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 6px;font-size:18px}
#bill{position:fixed;inset:0;background:#E9ECEF;z-index:30;overflow:auto}
.billbar{position:sticky;top:0;display:flex;gap:8px;padding:10px;background:#fff;border-bottom:1px solid var(--line)}
.billbar button{flex:1;font-size:15px;padding:12px 6px}
.paper{background:#fff;max-width:760px;margin:12px auto;padding:20px 18px;font-size:14px;color:#111}
.bh{display:flex;justify-content:space-between;gap:12px;border-bottom:3px solid var(--g);padding-bottom:10px}
.bhouse{font-size:20px;font-weight:800;color:var(--g)}.btitle{font-size:16px;font-weight:700;margin-top:2px}.bmeta{font-size:12px;text-align:right;color:#444;line-height:1.6}
.bguest{margin-top:16px;font-size:15px;font-weight:700}
.paper table{width:100%;border-collapse:collapse;margin-top:6px}.paper th,.paper td{border-bottom:1px solid #ddd;padding:6px 4px;text-align:left;vertical-align:top}
.paper th{background:var(--soft);font-size:12px}.paper .r{text-align:right;white-space:nowrap}.paper tfoot td{font-weight:800;border-top:2px solid #999}
.bsm{font-size:11px;color:#666}
.grand{display:flex;justify-content:space-between;align-items:center;margin-top:16px;background:var(--g2);padding:12px;border-radius:8px;font-size:16px;font-weight:700}.grand strong{font-size:22px;color:var(--g)}
.words{font-size:12px;margin-top:6px;color:#333}
.sign{display:flex;justify-content:space-between;gap:20px;margin-top:40px;font-size:13px}.sign div{flex:1;border-top:1px solid #555;padding-top:6px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:15px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.hidden{display:none!important}
@media print{
 body{padding:0;background:#fff}
 header,main,nav,.overlay,.toast,.billbar{display:none!important}
 #bill{position:static;background:#fff;overflow:visible}
 .paper{margin:0;max-width:none;padding:0}
}
</style>

// Devanagari -> rough Latin (Gujarati is first shifted to Devanagari)
const DEV_C={'क':'k','ख':'kh','ग':'g','घ':'gh','ङ':'n','च':'ch','छ':'chh','ज':'j','झ':'jh','ञ':'n','ट':'t','ठ':'th','ड':'d','ढ':'dh','ण':'n','त':'t','थ':'th','द':'d','ध':'dh','न':'n','प':'p','फ':'ph','ब':'b','भ':'bh','म':'m','य':'y','र':'r','ल':'l','ळ':'l','व':'v','श':'sh','ष':'sh','स':'s','ह':'h','\u0958':'q','\u0959':'kh','\u095A':'g','\u095B':'z','\u095C':'r','\u095D':'rh','\u095E':'f','\u095F':'y'};
const DEV_V={'अ':'a','आ':'aa','इ':'i','ई':'ee','उ':'u','ऊ':'oo','ऋ':'ri','ए':'e','ऐ':'ai','ओ':'o','औ':'au','ऑ':'o','ऍ':'e'};
const DEV_M={'ा':'aa','ि':'i','ी':'ee','ु':'u','ू':'oo','ृ':'ri','े':'e','ै':'ai','ो':'o','ौ':'au','ॉ':'o','ॅ':'e'};
const NUKTA={'क':'q','ज':'z','ड':'r','ढ':'rh','फ':'f'};
function translit(str){
 str=String(str).replace(/[\u0A80-\u0AFF]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x180))
  .replace(/[\u0966-\u096F]/g,c=>String(c.charCodeAt(0)-0x966));
 const ch=[...str];let out='';
 for(let i=0;i<ch.length;i++){
  const c=ch[i];
  if(DEV_C[c]){
   let cons=DEV_C[c],j=i+1;
   if(ch[j]==='\u093C'){cons=NUKTA[c]||cons;j++}
   const nx=ch[j];
   if(nx==='\u094D'){out+=cons;i=j;continue}
   if(DEV_M[nx]){out+=cons+DEV_M[nx];i=j;continue}
   const end=!nx||!/[\u0900-\u097F]/.test(nx);
   out+=cons+(end?'':'a');i=j-1;continue;
  }
  if(DEV_V[c]){out+=DEV_V[c];continue}
  if(DEV_M[c]){out+=DEV_M[c];continue}
  if(c==='\u0902'||c==='\u0901'){out+='n';continue}
  if(c==='\u0903'){out+='h';continue}
  if(c==='\u094D'||c==='\u093C')continue;
  out+=c;
 }
 return out;
}
// sound-alike key so "chai", "chaay", "चाय" all compare equal
function skel(w){
 let s=String(w).toLowerCase().replace(/[^a-z0-9]/g,'');
 if(!s||/^\d/.test(s))return s;
 s=s.replace(/chh|ch/g,'C').replace(/c/g,'k').replace(/C/g,'c')
  .replace(/sh/g,'s').replace(/ph/g,'f').replace(/kh/g,'k').replace(/gh/g,'g').replace(/th/g,'t').replace(/dh/g,'d').replace(/bh/g,'b').replace(/jh/g,'j').replace(/rh/g,'r')
  .replace(/w/g,'v').replace(/z/g,'j').replace(/q/g,'k').replace(/x/g,'ks')
  .replace(/(.)h/g,'$1')
  .replace(/aa+/g,'a').replace(/ee|ii|ie|ea|iy/g,'i').replace(/oo|uu|ou/g,'u').replace(/ai|ae|ay|ei|ey/g,'e').replace(/au|ao/g,'o')
  .replace(/(.)\1+/g,'$1');
 if(s.length>=3)s=s.replace(/a$/,'');
 return s;
}
function cskel(w){const s=skel(w);return s?(s[0]+s.slice(1).replace(/[aeiou]/g,'')).replace(/(.)\1+/g,'$1'):''}

function buildLex(){
 const lex=new Map(),clex=new Map();
 const put=(w,v)=>{const j=String(w).toLowerCase().replace(/\s+/g,'');const k=skel(j);if(!k)return;if(!lex.has(k))lex.set(k,v);const c=cskel(j);if(c.length>=3&&!clex.has(c))clex.set(c,v)};
 DATEW.forEach(([ws,off])=>ws.split(' ').forEach(w=>put(w,{type:'date',off})));
 SLOTW.forEach(([ws,s])=>ws.split(' ').forEach(w=>put(w,{type:'slot',slot:s})));
 NASHTAW.forEach(w=>put(w,{type:'nashta'}));
 MEALW.forEach(w=>put(w,{type:'meal',generic:true}));
 MEAL_DISH.forEach(w=>put(w,{type:'meal',generic:false,word:w}));
 for(const it of S.items){
  Object.values(it.name||{}).filter(Boolean).forEach(n=>String(n).split(/[\/(),]/).forEach(p=>{p=p.trim();if(!p)return;put(p,{type:'item',id:it.id,generic:true});const tl=translit(p);if(tl!==p)put(tl,{type:'item',id:it.id,generic:true})}));
  String(it.keys||'').split(',').forEach(k=>{k=k.trim();if(!k)return;const tk=translit(k).toLowerCase();put(tk,{type:'item',id:it.id,generic:GENERIC.has(skel(tk.replace(/\s+/g,''))),word:k})});
 }
 return {lex,clex};
}
function guestKeys(){
 const prim=[],sec=[];
 for(const g of S.guests){
  const forms=[g.name,...String(g.aliases||'').split(',')].map(s=>s.trim()).filter(Boolean);
  for(const f of forms){
   const words=translit(f).toLowerCase().split(/[^a-z0-9]+/).filter(w=>w&&!STOP.has(w));
   if(!words.length)continue;
   prim.push({name:g.name,k:skel(words[0]),c:cskel(words[0])});
   if(words.length>1){const j=words.join('');prim.push({name:g.name,k:skel(j),c:cskel(j),full:true});words.slice(1).forEach(w=>sec.push({name:g.name,k:skel(w),c:cskel(w)}))}
  }
 }
 const cnt={};sec.forEach(s=>{cnt[s.k]=(cnt[s.k]||new Set()).add(s.name)});
 return prim.concat(sec.filter(s=>cnt[s.k].size===1)).filter(x=>x.k.length>=3);
}
function matchGuest(w,keys,fullOnly){
 const k=skel(w);if(k.length<3)return null;
 for(const g of keys){if(fullOnly&&!g.full)continue;if(k===g.k)return g.name}
 if(fullOnly)return null;
 for(const g of keys)if(g.k.length>=4&&k.startsWith(g.k))return g.name;
 const c=cskel(w);
 for(const g of keys)if(g.c.length>=3&&c===g.c)return g.name;
 return null;
}
function tokens(text){
 return translit(text).toLowerCase().replace(/(\d+(\.\d+)?)/g,' $1 ').replace(/[^a-z0-9.]+/g,' ')
  .split(/\s+/).map(w=>w.replace(/^\.+|\.+$/g,'')).filter(Boolean);
}
function parse(text,ctxGuest){
 const L=buildLex(),GK=guestKeys(),toks=tokens(text),cls=[];
 for(let i=0;i<toks.length;i++){
  const w=toks[i];
  if(i+1<toks.length&&!STOP.has(w)&&!STOP.has(toks[i+1])){
   const bi=w+toks[i+1];
   const g=matchGuest(bi,GK,true);if(g){cls.push({type:'guest',name:g});i++;continue}
   const v=L.lex.get(skel(bi));if(v&&(v.type==='item'||v.type==='meal')){cls.push({...v});i++;continue}
  }
  if(/^\d+(\.\d+)?$/.test(w)){cls.push({type:'num',n:Number(w)});continue}
  if(Object.prototype.hasOwnProperty.call(NUMW,w)){cls.push({type:'num',n:NUMW[w]});continue}
  if(UNIT.has(w)){cls.push({type:'unit'});continue}
  if(STOP.has(w))continue;
  if(CONJ.has(w)){cls.push({type:'conj'});continue}
  const g=matchGuest(w,GK);if(g){cls.push({type:'guest',name:g});continue}
  let v=L.lex.get(skel(w));if(!v){const c=cskel(w);if(c.length>=3)v=L.clex.get(c)}
  cls.push(v?{...v}:{type:'other',w});
 }
 let off=0,slot='',group=null,lastNum=null,prev=null,prev2=null,lastGuest='';
 const occ=[],pend=[];
 const MEAL_BY_SLOT={morning:'breakfast',afternoon:'lunch',evening:'dinner',night:'dinner'};
 for(const c of cls){
  if(c.type==='unit')continue;
  if(c.type==='num'){lastNum=c.n;prev2=prev;prev=c;continue}
  if(c.type==='date')off=c.off;
  else if(c.type==='slot')slot=c.slot;
  else if(c.type==='guest'){
   lastGuest=c.name;
   const joined=group&&prev&&(prev.type==='guest'||(prev.type==='conj'&&prev2&&prev2.type==='guest'));
   if(joined){if(!group.includes(c.name))group.push(c.name)}
   else{group=[c.name];if(pend.length){pend.forEach(o=>o.guests=group);pend.length=0}}
  }
  else if(c.type==='item'||c.type==='meal'||c.type==='nashta'){
   let id=null,s=slot,generic=!!c.generic,note=c.generic?'':(c.word||'');
   if(c.type==='item'){id=c.id;const it=itemById(id);if(it&&it.meal){s=it.meal;slot=s}}
   else if(c.type==='meal'){const sl=slot||slotNow();id=MEAL_BY_SLOT[sl];const it=itemById(id);s=(it&&it.meal)||sl;slot=s}
   else{const sl=slot||slotNow();generic=true;if(sl==='morning'){id='breakfast';s='morning';slot='morning'}else{id='snacks';s=sl;slot=sl}}
   if(id&&itemById(id)){const o={id,qty:lastNum>0?lastNum:1,slot:s,generic,note,guests:group};occ.push(o);if(!group)pend.push(o)}
  }
  lastNum=null;prev2=prev;prev=c;
 }
 const dflt=[ctxGuest||''];pend.forEach(o=>o.guests=dflt);
 const date=addDays(todayISO(),off),rows=[],mealIdx=new Map();
 for(const o of occ)for(const g of o.guests){
  const it=itemById(o.id);
  if(it.meal){
   const key=g+'|'+o.id+'|'+o.slot,ex=mealIdx.get(key);
   if(ex){if(o.note&&!ex.notes.includes(o.note))ex.notes.push(o.note);if(o.qty>ex.qty)ex.qty=o.qty;continue}
   const r={guest:g,itemId:o.id,qty:o.qty,slot:o.slot,notes:o.note?[o.note]:[],date};mealIdx.set(key,r);rows.push(r);
  }else rows.push({guest:g,itemId:o.id,qty:o.qty,slot:o.slot,notes:o.note?[o.note]:[],date});
 }
 rows.forEach(r=>{r.note=r.notes.join(', ');delete r.notes});
 return {rows,lastGuest};
}

function periodText(list){
 const ds=list.map(e=>e.date).sort();const a=rf.from||ds[0],b=rf.to||ds[ds.length-1];
 return a===b?fmtDate(a,false,true):`${fmtDate(a,false,true)} – ${fmtDate(b,false,true)}`;
}
function byGuest(list){const m=new Map();[...list].sort(cmpAsc).forEach(e=>{const k=e.guest||'—';if(!m.has(k))m.set(k,[]);m.get(k).push(e)});return [...m].sort((a,b)=>a[0].localeCompare(b[0]))}
function inWords(n){
 const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
 const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
 const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');
 const three=x=>{const h=Math.floor(x/100),r=x%100;return(h?a[h]+' Hundred'+(r?' ':''):'')+(r?two(r):'')};
 let r=Math.floor(n),p=Math.round((n-r)*100);if(p===100){r++;p=0}
 const parts=[],cr=Math.floor(r/1e7);r%=1e7;const lk=Math.floor(r/1e5);r%=1e5;const th=Math.floor(r/1000);r%=1000;
 if(cr)parts.push(three(cr%1000)+' Crore');if(lk)parts.push(two(lk)+' Lakh');if(th)parts.push(two(th)+' Thousand');if(r)parts.push(three(r));
 return 'Rupees '+(parts.join(' ')||'Zero')+(p?' and '+two(p)+' Paise':'')+' Only';
}
function openBill(){
 const list=filtered();if(!list.length){toast(t('noRecords'));return}
 billList=list;const groups=byGuest(list);
 let h=`<div class="paper"><div class="bh"><div>${S.settings.house?`<div class="bhouse">${safe(S.settings.house)}</div>`:''}<div class="btitle">${t('billTitle')}</div></div>
  <div class="bmeta">${t('date')}: ${fmtDate(todayISO(),false,true)}<br>${t('period')}: ${periodText(list)}</div></div>`;
 for(const [g,rows] of groups){
  h+=`<div class="bguest">👤 ${t('guest')}: ${safe(g)}</div><table><thead><tr><th>${t('date')}</th><th>${t('item')}</th><th class="r">${t('qty')}</th><th class="r">${t('rate')}</th><th class="r">${t('amount')}</th></tr></thead><tbody>`;
  let last='';
  rows.forEach(e=>{const sub=[e.slot?slotName(e.slot):'',e.note||''].filter(Boolean).map(safe).join(' · ');
   h+=`<tr><td>${e.date!==last?fmtDate(e.date):''}</td><td>${safe(ename(e))}${sub?`<div class="bsm">${sub}</div>`:''}</td><td class="r">${num(e.qty)}</td><td class="r">${num(e.rate)}</td><td class="r">${num(e.amount)}</td></tr>`;last=e.date});
  h+=`</tbody><tfoot><tr><td colspan="4">${t('guestTotal')}</td><td class="r">${money(sum(rows))}</td></tr></tfoot></table>`;
 }
 const sm=new Map();list.forEach(e=>{const k=ename(e);const v=sm.get(k)||{q:0,a:0};v.q+=Number(e.qty)||0;v.a+=Number(e.amount)||0;sm.set(k,v)});
 h+=`<div class="bguest">${t('summary')}</div><table><thead><tr><th>${t('item')}</th><th class="r">${t('qty')}</th><th class="r">${t('amount')}</th></tr></thead><tbody>${[...sm].map(([k,v])=>`<tr><td>${safe(k)}</td><td class="r">${num(v.q)}</td><td class="r">${num(v.a)}</td></tr>`).join('')}</tbody></table>`;
 const tot=sum(list);
 h+=`<div class="grand"><span>${t('grand')}</span><strong>${money(tot)}</strong></div><div class="words">${t('inWords')}: ${inWords(tot)}</div>
  <div class="sign"><div>${t('preparedBy')}${S.settings.cook?`: <b>${safe(S.settings.cook)}</b>`:''}</div><div>${t('approvedBy')}</div></div></div>`;
 $('#billBody').innerHTML=h;$('#bill').classList.remove('hidden');$('#bill').scrollTop=0;
}
function shareText(list){
 const L=[`*${t('billTitle')}*`];if(S.settings.house)L.push(S.settings.house);
 L.push(`${t('period')}: ${periodText(list)}`);
 for(const [g,rows] of byGuest(list)){
  L.push('',`👤 *${g}*`);let last='';
  rows.forEach(e=>{if(e.date!==last){L.push(`_${fmtDate(e.date,true)}_`);last=e.date}
   L.push(`• ${ename(e)}${e.slot?' ('+slotName(e.slot)+')':''}: ${num(e.qty)} × ₹${num(e.rate)} = ${money(e.amount)}${e.note?' – '+e.note:''}`)});
  L.push(`${t('guestTotal')}: *${money(sum(rows))}*`);
 }
 L.push('',`*${t('grand')}: ${money(sum(list))}*`);
 if(S.settings.cook)L.push(`${t('preparedBy')}: ${S.settings.cook}`);
 return L.join('\n');
}
async function doShare(list){
 if(!list.length){toast(t('noRecords'));return}
 const text=shareText(list);
 if(navigator.share){try{await navigator.share({title:t('billTitle'),text});return}catch(e){if(e.name==='AbortError')return}}
 window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
}
function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportCSV(){
 const list=filtered().sort(cmpAsc);if(!list.length){toast(t('noRecords'));return}
 const rows=[['Date','Guest','Item','Time','Quantity','Rate','Amount','Note'],...list.map(e=>[e.date,e.guest,ename(e),slotName(e.slot),e.qty,e.rate,e.amount,e.note||''])];
 rows.push(['','','','','','TOTAL',sum(list),'']);
 const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
 download(`bolo-bill-${rf.from||'start'}-to-${rf.to||'end'}.csv`,csv,'text/csv;charset=utf-8');
}
function doRestore(file){
 if(!file)return;const r=new FileReader();
 r.onload=()=>{try{
   const d=JSON.parse(r.result);let next;
   if(d&&d.version===2&&Array.isArray(d.entries))next=d;
   else if(d&&Array.isArray(d.entries)){next=fresh();next.entries=migrateOld(d.entries)}
   else throw new Error('bad');
   if(!confirm(t('restoreConfirm')))return;
   S=normalize(next);lang=S.settings.lang||lang;save();renderAll();toast(t('restored'));
  }catch(e){toast(t('badFile'))}};
 r.readAsText(file);
}

/* ================= VOICE ================= */
function startVoice(){
 if(!SR){toast(t('noVoice'));return}
 if(!window.isSecureContext){vstatus=t('needLink');$('#vstatus').textContent=vstatus;return}
 if(listening&&rec){rec.stop();return}
 try{rec=new SR()}catch(e){toast(t('noVoice'));return}
 rec.lang=S.settings.voiceLang;rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
 let finalText='';const box=$('#vtext');const base=box?box.value.trim():'';
 rec.onstart=()=>{listening=true;vstatus='';const m=document.querySelector('.mic');if(m)m.classList.add('live');$('#vstatus').textContent=t('listening')};
 rec.onresult=ev=>{let interim='';for(let i=ev.resultIndex;i<ev.results.length;i++){const x=ev.results[i];if(x.isFinal)finalText+=x[0].transcript+' ';else interim+=x[0].transcript}const b=$('#vtext');if(b)b.value=(base+' '+finalText+interim).trim()};
 rec.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed')vstatus=window.isSecureContext?t('voiceDenied'):t('needLink');else if(ev.error==='network')vstatus=t('voiceNet');else if(ev.error!=='no-speech'&&ev.error!=='aborted')vstatus=ev.error;$('#vstatus').textContent=vstatus};
 rec.onend=()=>{listening=false;const m=document.querySelector('.mic');if(m)m.classList.remove('live');
  const b=$('#vtext');const txt=b?b.value.trim():'';
  if(finalText.trim()&&txt){b.value='';handleText(txt)}else if(!vstatus)$('#vstatus').textContent=t('mic')};
 try{rec.start()}catch(e){listening=false}
}

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
 if(e.target.id==='sheet'){closeSheet();return}
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act;
 switch(a){
  case 'nav':showPage(b.dataset.p);break;
  case 'lang':{const i=LANGS.findIndex(x=>x[0]===lang);setLang(LANGS[(i+1)%LANGS.length][0]);break}
  case 'setLang':setLang(b.dataset.l);break;
  case 'vlang':S.settings.voiceLang=b.dataset.v;save();renderAdd();break;
  case 'mic':startVoice();break;
  case 'parseText':{const box=$('#vtext');const txt=box.value.trim();if(txt){box.value='';handleText(txt)}break}
  case 'pickGuest':S.settings.lastGuest=b.dataset.name;save();renderAdd();break;
  case 'quickGuest':{const n=prompt(t('guestPh'));const nm=addGuest(n);if(nm){S.settings.lastGuest=nm;save();renderAdd()}break}
  case 'tile':addTile(b.dataset.id);break;
  case 'ddel':{const o=rowObj(b);S.draft=S.draft.filter(x=>x!==o);save();renderAdd();break}
  case 'minus':case 'plus':{const o=rowObj(b);if(!o)return;let q=Number(o.qty)||0;q=a==='plus'?q+1:Math.max(1,q-1);o.qty=q;const row=b.closest('.drow');row.querySelector('[data-f=qty]').value=q;row.querySelector('[data-amt]').textContent=money(amt(o));if(row.dataset.id!=='__edit')save();break}
  case 'saveAll':saveAll();break;
  case 'clearDraft':if(confirm(t('clearAll')+'?')){S.draft=[];save();renderAdd()}break;
  case 'openEdit':openEdit(b.dataset.id);break;
  case 'sheetSave':sheetSave();break;
  case 'sheetDel':if(editObj&&confirm(t('confirmDel'))){S.entries=S.entries.filter(x=>x.id!==editObj.id);save();closeSheet();renderRecords()}break;
  case 'sheetClose':closeSheet();break;
  case 'preset':{const td=todayISO();const p=b.dataset.p;if(p==='today'){rf.from=rf.to=td}else if(p==='month'){rf.from=td.slice(0,8)+'01';rf.to=td}else{rf.from=rf.to=''}renderRecords();break}
  case 'bill':openBill();break;
  case 'share':doShare(filtered());break;
  case 'csv':exportCSV();break;
  case 'billPrint':window.print();break;
  case 'billShare':doShare(billList);break;
  case 'billClose':$('#bill').classList.add('hidden');break;
  case 'gadd':{const el=$('#newGuest');if(addGuest(el.value)){el.value='';renderSettings()}break}
  case 'gdel':{const id=b.closest('[data-gid]').dataset.gid;const g=S.guests.find(x=>x.id===id);if(g&&confirm(t('removeGuest'))){S.guests=S.guests.filter(x=>x!==g);if(S.settings.lastGuest===g.name)S.settings.lastGuest='';save();renderSettings()}break}
  case 'iadd':{const n=$('#newItem').value.trim();if(!n)return;S.items.push({id:'i'+uid(),icon:'🍽️',rate:Math.max(0,Number($('#newItemRate').value)||0),name:{en:n,hi:n,gu:n},keys:''});save();renderSettings();break}
  case 'idel':{const id=b.closest('[data-iid]').dataset.iid;const it=itemById(id);if(it&&confirm(t('removeItem')+'\n'+iname(it))){S.items=S.items.filter(x=>x!==it);S.draft=S.draft.filter(o=>o.itemId!==id);save();renderSettings()}break}
  case 'backup':download(`bolo-bill-backup-${todayISO()}.json`,JSON.stringify(Object.assign({},S,{exportedAt:new Date().toISOString()}),null,1),'application/json');break;
  case 'restore':$('#restoreFile').click();break;
 }
});
document.addEventListener('input',e=>{if(e.target.dataset.f)onField(e.target)});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset.f){onField(el);return}
 if(el.dataset.g){const g=S.guests.find(x=>x.id===el.closest('[data-gid]').dataset.gid);if(!g)return;if(el.dataset.g==='name')renameGuest(g,el.value);else{g.aliases=el.value;save()}return}
 if(el.dataset.i){const it=itemById(el.closest('[data-iid]').dataset.iid);if(!it)return;const k=el.dataset.i;
  if(k==='name'){const v=el.value.trim();if(v)it.name[lang]=v;else el.value=iname(it)}else if(k==='rate')it.rate=Math.max(0,Number(el.value)||0);else it.keys=el.value;save();return}
 if(el.dataset.s){S.settings[el.dataset.s]=el.value.trim();save();return}
 if(el.id==='restoreFile'){doRestore(el.files[0]);el.value='';return}
 if(el.id==='recGuest'){rf.guest=el.value;renderRecords()}
 else if(el.id==='recFrom'){rf.from=el.value;renderRecords()}
 else if(el.id==='recTo'){rf.to=el.value;renderRecords()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='newGuest'){e.preventDefault();$('[data-act=gadd]').click()}});

/* ================= START ================= */
load();
lang=S.settings.lang||'hi';
{const td=todayISO();rf.from=td.slice(0,8)+'01';rf.to=td}
renderAll();
</script>
